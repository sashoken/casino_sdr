<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Казино СДР</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&display=swap">
<style>
:root{--bg:#efe9f6;--panel:#fff;--ink:#25173a;--mute:#6b5b86;--brass:#9a6b10;--win:#0b8a5a;--lose:#b3263e;--reel:#f6f2fb;--line:#d8cce8;--btn:#25173a;--btnink:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--panel:#0b0b0b;--ink:#f2f2f2;--mute:#9a9a9a;--brass:#e6b95c;--win:#6fe3b0;--lose:#ff7d93;--reel:#000;--line:#2a2a2a;--btn:#e6b95c;--btnink:#000}}
:root[data-theme="dark"]{--bg:#000;--panel:#0b0b0b;--ink:#f2f2f2;--mute:#9a9a9a;--brass:#e6b95c;--win:#6fe3b0;--lose:#ff7d93;--reel:#000;--line:#2a2a2a;--btn:#e6b95c;--btnink:#000}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.4}
#app{max-width:520px;margin:0 auto;padding:20px 16px 32px;display:grid;gap:14px;grid-template-columns:minmax(0,1fr);grid-template-areas:"top" "bal" "machine" "add" "pay" "foot"}
.top{grid-area:top}.bal{grid-area:bal}.machine{grid-area:machine}.addc{grid-area:add}.payc{grid-area:pay}.foot{grid-area:foot}
h1{font-size:1.5rem;font-weight:800;margin:0}
h2{margin:0 0 4px;font-size:1.2rem}
.sub{color:var(--mute);margin:2px 0 0;font-size:.9rem}
button,input,select{font:inherit;color:inherit}
button{border:1px solid var(--line);background:transparent;border-radius:10px;padding:10px 12px;cursor:pointer;font-weight:700;min-height:44px}
button:hover{border-color:var(--brass)}
:is(button,input,select):focus-visible{outline:3px solid var(--brass);outline-offset:2px}
input{background:var(--reel);border:1px solid var(--line);border-radius:10px;padding:10px;min-height:44px;width:100%;font-weight:700;text-align:center;font-variant-numeric:tabular-nums}
.ctl{display:flex;gap:6px;margin-top:12px}
.ctl>button,.dd>button{background:var(--panel);display:flex;align-items:center;gap:8px}
.dd{position:relative}
.menu{position:absolute;z-index:20;top:100%;left:0;margin-top:6px;min-width:230px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px;box-shadow:0 8px 30px rgba(0,0,0,.4)}
.menu[hidden]{display:none}
.opt{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border-color:transparent;margin-bottom:2px}
.opt.on{border-color:var(--brass)}
.flag{width:28px;height:19px;border-radius:3px;flex-shrink:0;box-shadow:0 0 0 1px rgba(128,128,128,.4)}
.bal{display:flex;justify-content:space-between;align-items:baseline;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 16px}
.bal small{color:var(--mute)}
.bal b{font-size:clamp(1.15rem,6vw,2rem);font-weight:800;color:var(--brass);font-variant-numeric:tabular-nums;text-align:right;overflow-wrap:anywhere}
.machine{background:var(--panel);border:2px solid var(--brass);border-radius:22px;padding:16px}
.machine.shake{animation:shake .5s 3}
.machine.glow{animation:glow .8s 5}
@keyframes shake{25%{transform:translate(-6px,3px) rotate(-.6deg)}75%{transform:translate(6px,-3px) rotate(.6deg)}}
@keyframes glow{50%{box-shadow:0 0 40px 8px var(--brass)}}
.reels{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.reel{position:relative;overflow:hidden;background:var(--reel);border:2px solid var(--line);border-radius:14px;aspect-ratio:1/1.1;transition:border-color .2s}
.strip{position:absolute;left:0;right:0;top:0;height:100%;display:flex;flex-direction:column}
.cell{flex:1;display:grid;place-items:center}
.cell svg{width:70%;height:70%;filter:drop-shadow(0 2px 3px rgba(0,0,0,.35))}
.reel.spin{border-color:var(--brass)}
.reel.spin .strip{filter:blur(2px)}
.reel.hit{border-color:var(--win);animation:pop .5s}
@keyframes pop{50%{transform:scale(1.07)}}
.msg{min-height:3.2em;text-align:center;margin:12px 0 6px;font-weight:700}
.msg.w{color:var(--win)}.msg.l{color:var(--mute)}.msg.e{color:var(--lose)}
.betrow{display:flex;gap:6px;margin-bottom:10px}
.betrow input{flex:1;min-width:0}
.spinbtn{width:100%;background:var(--btn);color:var(--btnink);border:0;font-size:1.25rem;padding:14px;border-radius:14px}
.spinbtn:disabled{opacity:.5;cursor:default}
.lbl{font-size:.85rem;color:var(--mute);margin:0 0 6px}
.hint{display:none;text-align:center;color:var(--mute);font-size:.85rem;margin:10px 0 0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.add{display:flex;gap:6px;flex-wrap:wrap}
.add input{flex:1 1 90px;width:auto}
.add .go{background:var(--btn);color:var(--btnink);border:0}
table{width:100%;border-collapse:collapse;font-size:.95rem}
td{padding:5px 0;border-bottom:1px solid var(--line)}
td:last-child{text-align:right;font-weight:700;color:var(--brass)}
tr:last-child td{border:0}
.pi svg{width:24px;height:24px;vertical-align:middle;margin-right:2px}
.foot{display:flex;justify-content:space-between;color:var(--mute);font-size:.85rem;gap:8px;flex-wrap:wrap}
.foot button{min-height:36px;padding:6px 10px;font-weight:500}
dialog{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:16px;padding:18px;width:min(92vw,460px);max-height:90vh;overflow:auto}
dialog::backdrop{background:rgba(0,0,0,.65)}
.row{margin:14px 0}
.ver{color:var(--mute);font-size:.85rem;display:flex;justify-content:space-between;align-items:center;margin-top:16px}
input[type=range]{padding:0;accent-color:var(--brass)}
.jp{position:fixed;inset:0;z-index:50;display:grid;place-items:center;text-align:center;background:rgba(0,0,0,.72);cursor:pointer}
.jp[hidden]{display:none}
.jp.mega{animation:flash .6s 6}
@keyframes flash{50%{background:rgba(120,60,0,.85)}}
#cv{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.jpt{position:relative;display:grid;gap:8px;color:#fff;font-size:1.6rem;font-weight:800;padding:0 16px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.jpt b{font-size:clamp(2.2rem,12vw,4.2rem);background:linear-gradient(90deg,#ff5f6d,#ffc371,#6fe3b0,#5fa8ff,#c77dff,#ff5f6d);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:rb 1.2s linear infinite,zoom .7s}
@keyframes rb{to{background-position:-200% 0}}
@keyframes zoom{0%{transform:scale(.2);opacity:0}70%{transform:scale(1.15)}}
.reel.thud{animation:thud .22s}
@keyframes thud{40%{transform:translateY(4px) scaleY(.985)}}
.toast{position:fixed;inset:auto;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));margin:0;transform:translate(-50%,16px);max-width:90vw;padding:12px 18px;border:1px solid var(--brass);border-radius:999px;background:var(--panel);color:var(--ink);font-weight:700;box-shadow:0 8px 30px rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;overflow:visible;z-index:100}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (min-width:900px){
#app{max-width:1080px;padding:28px 32px 40px;gap:18px;grid-template-columns:minmax(0,1fr) 380px;grid-template-rows:auto auto auto 1fr auto;grid-template-areas:"top top" "machine bal" "machine add" "machine pay" "foot foot";align-items:start}
.top{display:flex;justify-content:space-between;align-items:center;gap:20px}
.ctl{margin-top:0}
h1{font-size:2rem}
.machine{padding:26px;align-self:start;position:sticky;top:20px}
.reels{gap:16px}
.reel{aspect-ratio:1/1.15}
.msg{font-size:1.2rem;margin:18px 0 10px}
.spinbtn{font-size:1.4rem;padding:18px}
.payc{align-self:stretch}
}
@media (hover:hover) and (min-width:900px){.hint{display:block}}
@media (prefers-reduced-motion:reduce){.reel.thud,.reel.hit,.machine.shake,.machine.glow,.jp.mega,.jpt b{animation:none}}

[hidden]{display:none!important}
dialog[open]{animation:dpop .3s cubic-bezier(.2,.9,.3,1.2)}dialog[open]::backdrop{animation:dfade .3s}
@keyframes dpop{from{opacity:0;transform:translateY(16px) scale(.93)}}@keyframes dfade{from{opacity:0}}
@keyframes shk{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
dialog.shk{animation:shk .4s}
.tabs{position:relative;display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:12px;padding:3px;margin:12px 0}
.tabs button{border:0;position:relative;z-index:1;transition:color .25s}.tabs button.on{color:var(--btnink)}
.tabs i{position:absolute;top:3px;bottom:3px;left:3px;width:calc(50% - 3px);background:var(--btn);border-radius:9px;transform:translateX(calc(var(--i,0)*100%));transition:transform .3s cubic-bezier(.3,1.3,.5,1)}
.amsg{color:var(--lose);min-height:1.4em;margin:6px 0;text-align:center;font-weight:700}
.big{font-size:1.3rem;font-weight:800;margin:12px 0 4px;text-align:center;overflow-wrap:anywhere}
#asub.ld{opacity:.6;pointer-events:none}#asub.ld::after{content:"";display:inline-block;width:1em;height:1em;margin-left:8px;vertical-align:-2px;border:2px solid currentColor;border-top-color:transparent;border-radius:50%;animation:spn .6s linear infinite}
@keyframes spn{to{transform:rotate(360deg)}}
#asub.ok{background:var(--win);color:#fff;animation:pop .5s}
#accbtn{max-width:9em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block!important}
.pulse{animation:pls .6s 3}@keyframes pls{50%{box-shadow:0 0 0 6px var(--brass);border-color:var(--brass)}}
.addc{position:relative}.addc.lock .add{opacity:.45}
.addc.lock::after{content:attr(data-lock);position:absolute;inset:0;display:grid;place-items:center;font-weight:800;cursor:pointer;background:color-mix(in srgb,var(--panel) 55%,transparent);border-radius:14px}
.em{font-size:clamp(1.8rem,9vw,3.4rem);line-height:1}.pi .em{font-size:20px}
.drow{display:flex;align-items:center;gap:8px;margin:4px 0}.drow input,.drow select{min-width:0;flex:1}.drow small{width:3.6em;color:var(--mute)}
@media (prefers-reduced-motion:reduce){dialog[open],dialog[open]::backdrop,dialog.shk,.pulse,#asub.ok{animation:none}.tabs i{transition:none}}
</style>
</head>

<div id="app">
<header class="top">
<div><h1 data-t="title"></h1><p class="sub" id="sub"></p></div>
<div class="ctl">
<div class="dd"><button id="curbtn" aria-haspopup="listbox" aria-expanded="false" data-al="curL"><span id="curflag"></span><span id="cursym">$</span><span aria-hidden="true">▾</span></button><div class="menu" id="curmenu" role="listbox" hidden></div></div>
<button id="accbtn" data-al="acc">👤</button>
<button id="theme">🌙</button>
<button id="gear" data-al="settings">⚙️</button>
</div>
</header>

buildPay()}

function render(){
$('bal').textContent=moneyBase(st.bal);
$('sub').textContent=T('sub',{x:money(minBet())});
$('bet').value=plain(st.bet);
$('curl').textContent=st.cur;$('cursym').textContent=st.cur;$('curflag').innerHTML=CF[st.cur];
$('stats').textContent=T('stats',{n:st.spins,w:st.won});
$('vol').value=st.vol;$('snd').textContent=T(st.mute?'soff':'son');
var d=eff()==='dark';$('theme').textContent=d?'☀️':'🌙';$('theme').setAttribute('aria-label',T(d?'toL':'toD'));
document.querySelectorAll('.opt').forEach(function(b){var on=st[b.dataset.g]===b.dataset.id;b.classList.toggle('on',on);b.setAttribute('aria-selected',on)});
$('who').textContent=user?'👤 '+ACC.users[user].n:T('guest');$('accbtn').textContent='👤'+(user?' '+ACC.users[user].n:'');$('addc').classList.toggle('lock',!user);
paint();save()}
function eff(){return root.getAttribute('data-theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light')}
function setBet(c){st.bet=c<minBet()?minBet():c>CAPC?CAPC:c;render()}
function pickFill(){var a=ids(),t=0;a.forEach(function(i){t+=sw(i)});var r=Math.random()*t;for(var k=0;k<a.length;k++){r-=sw(a[k]);if(r<0)return a[k]}return 0}
function pickSym(){return Math.random()<(DV.pf!=null?DV.pf/100:PF)?FLAG:pickFill()}
function step(){return st.bet<1000n?100n:st.bet<10000n?1000n:10000n}
$('minus').onclick=function(){SND.click();setBet(st.bet-step())};
$('plus').onclick=function(){SND.click();setBet(st.bet+step())};
$('half').onclick=function(){SND.click();setBet(st.bet/2n)};
$('dbl').onclick=function(){SND.click();setBet(st.bet*2n)};
$('max').onclick=function(){SND.click();setBet(st.bal/R())};
$('bet').onchange=function(){setBet(parse(this.value))};
$('bet').onkeydown=function(e){if(e.key==='Enter'){setBet(parse(this.value));spin()}};
$('theme').onclick=function(){var n=eff()==='dark'?'light':'dark';root.setAttribute('data-theme',n);try{localStorage.setItem('ponaroshku-theme',n)}catch(e){}SND.click();render()};
function addMoney(c){if(!user){need('m13');return}
if(c<=0n){say('m7',null,'e');SND.err();return}
var b=c*R(),n=st.bal+b,cb=CAPC*R();SND.click();
if(n>=cb){st.bal=cb;say('m8',{w:cb},'w')}else{st.bal=n;say('m9',{w:b},'w')}
render()}
document.querySelectorAll('[data-add]').forEach(function(b){b.onclick=function(){addMoney(BigInt(b.dataset.add)*100n)}});
$('addbtn').onclick=function(){addMoney(parse($('amt').value))};
$('reset').onclick=function(){if(busy)return;if(!user){need('m13');return}st.bal=10000n*R();st.spins=0;st.won=0n;st.bet=minBet();say('m10',{w:st.bal},'l');SND.click();render()};

/* барабаны */
var fast=window.matchMedia&&matchMedia('(prefers-reduced-motion:reduce)').matches;
var shown=[0,1,2];
reels.forEach(function(r,i){r.firstElementChild.innerHTML=cell(shown[i])});
function spin(){
if(busy)return;
var p=parse($('bet').value);st.bet=p<minBet()?minBet():p>CAPC?CAPC:p;
var Rs=R(),bb=st.bet*Rs;
if(bb>st.bal){say(user?'m6':'m14',null,'e');SND.err();if(!user)pulse();render();return}
busy=true;$('spin').disabled=true;
st.bal-=bb;st.spins++;render();say('m1',null,'l');
var res=[pickSym(),pickSym(),pickSym()],bet=st.bet,done=0,tk=setInterval(SND.tick,85);
reels.forEach(function(r,i){
var sp=r.firstElementChild,n=15+i*5,h=cell(pickFill())+cell(res[i]);
for(var k=2;k<n-1;k++)h+=cell(pickFill());
sp.innerHTML=h+cell(shown[i]);sp.style.height=n*100+'%';
r.classList.remove('hit');r.classList.add('spin');
var u=100/n,dur=fast?200:900+i*380;
var an=sp.animate([{transform:'translateY('+(-(n-1)*u)+'%)',easing:'cubic-bezier(.15,.6,.55,.85)'},{transform:'translateY('+(-u*.88)+'%)',offset:.8,easing:'cubic-bezier(.35,0,.25,1)'},{transform:'translateY('+(-u)+'%)'}],{duration:dur,fill:'forwards'});
setTimeout(function(){r.classList.remove('spin','thud');void r.offsetWidth;r.classList.add('thud');SND.stop()},dur*.8);
an.onfinish=function(){shown[i]=res[i];sp.style.height='100%';sp.innerHTML=cell(res[i]);an.cancel();r.classList.remove('thud');
if(++done===3){clearInterval(tk);finish(res,bet,Rs)}};
})}
function finish(res,bet,Rs){
var a=res[0],b=res[1],c=res[2],win=0n,hit=[],kind='',nf=res.filter(function(x){return x===FLAG}).length;
function mb(m){return bet*BigInt(Math.round(m*100))/100n}
var cm=DV.cb.filter(function(k){return k.any?k.s.slice().sort().join()===res.slice().sort().join():k.s.join()===res.join()})[0];
if(nf){win=mb(nf===3?1000:500);hit=[0,1,2].filter(function(i){return res[i]===FLAG});say('m12',{w:win*Rs,m:NF.format(nf===3?1000:500)},'w');kind='mega'}
else if(cm){win=mb(cm.m);hit=[0,1,2];say('m3b',{w:win*Rs,m:cm.m},'w');kind=cm.m>=100?'big':'win'}
else if(a===b&&b===c){var mm=sy(a).m;win=mb(mm);hit=[0,1,2];say('m3',{w:win*Rs,m:mm},'w');kind=a===4?'mega':(a===2||a===3||mm>=100)?'big':'win'}
else if(a===b||a===c||b===c){win=mb(.7);hit=a===b?[0,1]:a===c?[0,2]:[1,2];say('m4',{w:win*Rs,m:'0.7'},'w');kind='pair'}
else if(sy(a).c===sy(b).c&&sy(b).c===sy(c).c){win=bet;hit=[0,1,2];say('m11',{w:win*Rs},'w');kind='pair'}
else{say('m2',null,'l');SND.lose()}
var wb=win*Rs,cb=CAPC*Rs;
if(win>0n){st.bal=st.bal+wb>cb?cb:st.bal+wb;st.won+=wb;hit.forEach(function(i){reels[i].classList.add('hit')})}
busy=false;$('spin').disabled=false;render();
if(kind==='pair')SND.pair();else if(kind==='win')SND.win();else if(kind==='big'||kind==='mega'){SND[kind==='mega'?'jack':'win']();jackpot(kind,wb)}
if(st.bal<minBet()*Rs&&win===0n)say(user?'m5':'m14',null,'e')}

/* джекпот */
var jpTimer=null;
function hideJp(){$('jp').hidden=true;clearTimeout(jpTimer)}
$('jp').onclick=hideJp;
function jackpot(kind,wb){
var m=$('machine');$('jpt').innerHTML='<b>'+T(kind==='mega'?'jk':'bw')+'</b><span>'+moneyBase(wb)+'</span>';
$('jp').className='jp '+kind;$('jp').hidden=false;
m.classList.remove('shake','glow');void m.offsetWidth;m.classList.add(kind==='mega'?'shake':'glow');
if(!fast)burst(kind);
clearTimeout(jpTimer);jpTimer=setTimeout(hideJp,kind==='mega'?6000:4000)}
function burst(kind){
var c=$('cv'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;
var P=[],cols=['#ffd24d','#ff5f6d','#6fe3b0','#5fa8ff','#c77dff','#fff'],n=kind==='mega'?230:90;
for(var i=0;i<n;i++)P.push({x:Math.random()*c.width,y:-20-Math.random()*c.height*.7,vx:(Math.random()-.5)*3,vy:2+Math.random()*4,s:5+Math.random()*7,r:Math.random()*6,vr:(Math.random()-.5)*.3,c:cols[i%6],coin:kind==='mega'&&i%3===0});
var t0=performance.now();
(function f(t){x.clearRect(0,0,c.width,c.height);
P.forEach(function(p){p.x+=p.vx;p.y+=p.vy;p.vy+=.05;p.r+=p.vr;x.save();x.translate(p.x,p.y);x.rotate(p.r);
if(p.coin){x.fillStyle='#ffd24d';x.strokeStyle='#b8860b';x.beginPath();x.arc(0,0,p.s,0,7);x.fill();x.stroke()}
else{x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2)}x.restore()});
if(t-t0<5500&&!$('jp').hidden)requestAnimationFrame(f);else x.clearRect(0,0,c.width,c.height)})(t0)}


/* аккаунты: интерфейс */
function pulse(){['accbtn','addc'].forEach(function(id){var e=$(id);e.classList.remove('pulse');void e.offsetWidth;e.classList.add('pulse')})}
function need(k){say(k,null,'e');SND.err();pulse();setTimeout(openAcc,450)}
function setTab(m){am=m;document.querySelectorAll('#tabs button').forEach(function(b,i){b.classList.toggle('on',i===m)});$('tabs').style.setProperty('--i',m);$('asub').textContent=T(m?'regis':'login');$('ap').autocomplete=m?'new-password':'current-password';$('aerr').textContent=''}
function openAcc(){if($('acc').open)return;$('aguest').hidden=!!user;$('auser').hidden=!user;$('at').textContent=T('acct');
if(user){$('aname').textContent=T('ahello',{n:ACC.users[user].n});$('ainfo').textContent=T('ainfo')}setTab(am);$('acc').showModal()}
function aerr(k){$('aerr').textContent=T(k);shake($('acc'));SND.err()}
function auth(){var l=$('al').value.trim(),p=$('ap').value,k=l.toLowerCase(),u=ACC.users[k],b=$('asub');
if(!l||!p)return aerr('a1');if(am&&u)return aerr('a2');if(!am&&!u)return aerr('a3');
b.classList.add('ld');
hash(k+'|'+p).then(function(h){b.classList.remove('ld');
if(!am&&u.h!==h)return aerr('a3');
if(am)u=ACC.users[k]={n:l,h:h,d:{bal:st.bal.toString(),bet:st.bet.toString(),spins:st.spins,won:st.won.toString()}};
GS={bal:st.bal,bet:st.bet,spins:st.spins,won:st.won};user=k;ACC.cur=k;ld(u.d);wr();
b.classList.add('ok');b.textContent='✓';SND.win();
setTimeout(function(){b.classList.remove('ok');$('acc').close();$('al').value=$('ap').value='';toast(T('welcome',{n:u.n}));render()},700)})}
$('accbtn').onclick=function(){SND.click();openAcc()};
$('addc').onclick=function(){if(!user)need('m13')};
$('aclose').onclick=function(){$('acc').close()};
$('asub').onclick=auth;
$('al').onkeydown=$('ap').onkeydown=function(e){if(e.key==='Enter')auth()};
document.querySelectorAll('#tabs button').forEach(function(b,i){b.onclick=function(){SND.click();setTab(i)}});
$('aout').onclick=function(){save();var g=GS;st.bal=g.bal;st.bet=g.bet;st.spins=g.spins;st.won=g.won;user=null;ACC.cur=null;wr();fix();$('acc').close();toast(T('bye'));render()};

/* режим разработчика: интерфейс */
function rr(){shown=[0,1,2];reels.forEach(function(r,i){r.firstElementChild.innerHTML=cell(shown[i])})}
function dcheck(){hash('sdr-dev|'+$('dpw').value).then(function(h){if(h&&h===DH){dok=true;drender()}else{$('derr').textContent='Неверный пароль';shake($('dev'));SND.err()}})}
function drender(){var b=$('dbody'),h='';
if(!dok){b.innerHTML='<input id="dpw" type="password" placeholder="Пароль" autocomplete="off"><p class="amsg" id="derr"></p><button class="spinbtn" id="dgo">Войти</button>';
$('dgo').onclick=dcheck;$('dpw').onkeydown=function(e){if(e.key==='Enter')dcheck()};return}
var a=ids(),t=0;a.forEach(function(i){t+=sw(i)});
h+='<p class="lbl">Баланс ('+st.cur+')</p><div class="drow"><input id="dbi" value="'+plain(st.bal/R())+'"><button id="dbs">Задать</button></div>';
h+='<p class="lbl" style="margin-top:12px">Шансы: вес категории (процент считается сам)</p>';
a.forEach(function(i){h+='<div class="drow"><span class="pi">'+ic(i)+'</span><input type="number" min="0" step="any" data-w="'+i+'" value="'+sw(i)+'"><small>'+(t?(sw(i)/t*100).toFixed(1):0)+'%</small>'+(i>=100?'<button data-x="'+i+'">✕</button>':'')+'</div>'});
h+='<div class="drow"><span class="pi">'+ico(FLAG)+'</span><input type="number" min="0" step="any" id="dpf" value="'+(DV.pf!=null?DV.pf:+(PF*100).toPrecision(4))+'"><small>% на барабан</small></div>';
h+='<p class="lbl" style="margin-top:12px">Свой эмодзи: символ, ×выплата (три в ряд), вес</p><div class="drow"><input id="de" placeholder="🍕" maxlength="8" style="max-width:4.5em"><input id="dm" type="number" min="0" step="any" placeholder="×"><input id="dwt" type="number" min="0" step="any" value="3"><button id="dadd">+</button></div>';
var o=a.concat([FLAG]).map(function(i){return '<option value="'+i+'">'+(i>=100?sy(i).e:i===FLAG?'🇧🇮':EM[i])+'</option>'}).join('');
h+='<p class="lbl" style="margin-top:12px">Своя комбинация: 3 символа и ×выплата</p><div class="drow"><select id="c0">'+o+'</select><select id="c1">'+o+'</select><select id="c2">'+o+'</select></div><div class="drow"><input id="cm" type="number" min="0" step="any" placeholder="×"><label style="white-space:nowrap"><input type="checkbox" id="cany" style="width:auto;min-height:0"> любой порядок</label><button id="cadd">+</button></div>';
DV.cb.forEach(function(c,k){h+='<div class="drow"><span class="pi">'+c.s.map(ic).join('')+'</span><small style="flex:1;width:auto">×'+c.m+(c.any?' ⇄':'')+'</small><button data-cx="'+k+'">✕</button></div>'});
h+='<button id="drst" style="width:100%;margin-top:14px">Сбросить всё до стандартного</button>';
b.innerHTML=h;
function done(){dsave();drender();buildPay()}
b.querySelectorAll('[data-w]').forEach(function(e){e.onchange=function(){var i=+e.dataset.w,v=Math.max(0,+e.value||0);if(i<100)DV.w[i]=v;else sy(i).w=v;done()}});
$('dpf').onchange=function(){DV.pf=Math.min(100,Math.max(0,+this.value||0));dsave()};
$('dbs').onclick=function(){var k=user||'_',n=parse($('dbi').value)*R(),cb=CAPC*R();if(DV.u[k]==null)DV.u[k]=st.bal.toString();st.bal=n>cb?cb:n;dsave();render();toast('✓');SND.click()};
$('dadd').onclick=function(){var e=Array.from($('de').value.trim()).slice(0,8).join('');if(!e||/[<>&"']/.test(e)||DV.cu.length>=12)return;var id=100+(++DV.n);DV.cu.push({id:id,e:e,m:Math.max(0,+$('dm').value||0),w:Math.max(0,+$('dwt').value||0),c:'x'+id});SND.click();done()};
$('cadd').onclick=function(){if(DV.cb.length>=20)return;DV.cb.push({s:[+$('c0').value,+$('c1').value,+$('c2').value],m:Math.max(0,+$('cm').value||0),any:$('cany').checked});SND.click();done()};
b.querySelectorAll('[data-x]').forEach(function(e){e.onclick=function(){var i=+e.dataset.x;DV.cu=DV.cu.filter(function(x){return x.id!==i});DV.cb=DV.cb.filter(function(c){return c.s.indexOf(i)<0});rr();done()}});
b.querySelectorAll('[data-cx]').forEach(function(e){e.onclick=function(){DV.cb.splice(+e.dataset.cx,1);done()}});
$('drst').onclick=function(){var k=user||'_';DV.w={};DV.pf=null;DV.cu=[];DV.cb=[];if(DV.u[k]!=null){st.bal=BigInt(DV.u[k]);delete DV.u[k]}rr();dsave();render();drender();buildPay();toast('✓');SND.click()}}
$('devbtn').onclick=function(){SND.click();$('dlg').close();$('dev').showModal();drender()};
$('dclose').onclick=function(){$('dev').close()};

$('spin').onclick=spin;
document.addEventListener('keydown',function(e){
var tg=document.activeElement.tagName;if(document.querySelector('dialog[open]')||/INPUT|SELECT|TEXTAREA/.test(tg))return;
if(e.code==='Space'&&tg!=='BUTTON'){e.preventDefault();spin()}
else if(e.key==='Escape')closeMenu();
else if(e.key==='ArrowUp'){e.preventDefault();setBet(st.bet+step())}
else if(e.key==='ArrowDown'){e.preventDefault();setBet(st.bet-step())}
else if(e.code==='KeyM'){setMute(!st.mute)}});
setLoc();applyLang();render();
try{$('toast').showPopover()}catch(e){}
})();
</script>
