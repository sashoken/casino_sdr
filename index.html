<!DOCTYPE html>
<!--
  ВАЖНО ДЛЯ ЛЮБОГО ИИ (Claude и др.), который правит этот файл / IMPORTANT FOR ANY AI EDITING THIS FILE:
  1) Каждое обновление = новая версия «Alpha X.Y». Номер повышай сам, строго по порядку (сейчас Alpha 3.5).
  2) Если пользователь прислал запрос БЕЗ списка изменений для новой версии — НЕ делай файл.
     Сначала попроси у пользователя список изменений, и только потом вноси правки.
     If the request has NO changelog for the new version — do NOT build the file; ask the user for the changelog first.
  3) Получив список, обязательно добавь версию в массив CL (меню «Список изменений» в настройках)
     с переводами на ВСЕ языки игры (rus/ru, en, be, uk; язык «us» делается автотранслитом из ru).
  4) Ключ хранения аккаунтов 'sdr-casino-accounts' и коллекцию Firebase 'accounts' не менять; базу подарочных кодов не трогать без просьбы.
-->
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BonusDrop</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&display=swap">
<style>
:root{--bg:#000;--panel:#0b0b0b;--ink:#f2f2f2;--mute:#9a9a9a;--brass:#e6b95c;--win:#6fe3b0;--lose:#ff7d93;--reel:#000;--line:#2a2a2a;--btn:#e6b95c;--btnink:#000;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="light"]{--bg:#f6f6f4;--panel:#fff;--ink:#0b0b0c;--mute:#7a7a80;--brass:#111;--win:#0a7f55;--lose:#d6293e;--reel:#f1f1ef;--line:#e6e6e3;--btn:#111;--btnink:#fff}
:root[data-theme="dark"]{--bg:#000;--panel:#0b0b0b;--ink:#f2f2f2;--mute:#9a9a9a;--brass:#e6b95c;--win:#6fe3b0;--lose:#ff7d93;--reel:#000;--line:#2a2a2a;--btn:#e6b95c;--btnink:#000}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.4}
#app{max-width:520px;margin:0 auto;padding:20px 16px 32px;display:grid;gap:14px;grid-template-columns:minmax(0,1fr);grid-template-areas:"top" "bal" "machine" "gift" "wd" "add" "rst" "pay" "foot"}
.giftc{grid-area:gift}.wdc{grid-area:wd}.top{grid-area:top}.balw{grid-area:bal}.rstc{grid-area:rst}.machine{grid-area:machine}.addc{grid-area:add}.payc{grid-area:pay}.foot{grid-area:foot}
h1{font-size:1.5rem;font-weight:800;margin:0}
h2{margin:0 0 4px;font-size:1.2rem}
.sub{color:var(--mute);margin:2px 0 0;font-size:.9rem}
button,input,select{font:inherit;color:inherit}
button{border:1px solid var(--line);background:transparent;border-radius:10px;padding:10px 12px;cursor:pointer;font-weight:700;min-height:44px}
button:hover{border-color:var(--brass)}
:is(button,input,select):focus-visible{outline:3px solid var(--brass);outline-offset:2px}
input{background:var(--reel);border:1px solid var(--line);border-radius:10px;padding:10px;min-height:44px;width:100%;font-weight:700;text-align:center;font-variant-numeric:tabular-nums}
.ctl{display:flex;gap:6px;margin-top:12px}
.ctl>button,.dd>button{background:var(--panel);display:flex;align-items:center;gap:8px}
.dd{position:relative}
.menu{position:absolute;z-index:20;top:100%;left:0;margin-top:6px;min-width:230px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px;box-shadow:0 8px 30px rgba(0,0,0,.4)}
.menu[hidden]{display:none}
.opt{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border-color:transparent;margin-bottom:2px}
.opt.on{border-color:var(--brass)}
.flag{width:28px;height:19px;border-radius:3px;flex-shrink:0;box-shadow:0 0 0 1px rgba(128,128,128,.4)}
.bal{display:flex;justify-content:space-between;align-items:baseline;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 16px}
.bal small{color:var(--mute)}
.bal b{font-size:clamp(1.15rem,6vw,2rem);font-weight:800;color:var(--brass);font-variant-numeric:tabular-nums;text-align:right;overflow-wrap:anywhere}
.machine{background:var(--panel);border:2px solid var(--brass);border-radius:22px;padding:16px}
.machine.shake{animation:shake .5s 3}
.machine.glow{animation:glow .8s 5}
@keyframes shake{25%{transform:translate(-6px,3px) rotate(-.6deg)}75%{transform:translate(6px,-3px) rotate(.6deg)}}
@keyframes glow{50%{box-shadow:0 0 40px 8px var(--brass)}}
.reels{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.reel{position:relative;overflow:hidden;background:var(--reel);border:2px solid var(--line);border-radius:14px;aspect-ratio:1/1.1;transition:border-color .2s}
.strip{position:absolute;left:0;right:0;top:0;height:100%;display:flex;flex-direction:column}
.cell{flex:1;display:grid;place-items:center}
.cell svg{width:70%;height:70%;filter:drop-shadow(0 2px 3px rgba(0,0,0,.35))}
.reel.spin{border-color:var(--brass)}
.reel.spin .strip{filter:blur(2px)}
.reel.hit{border-color:var(--win);animation:pop .5s}
@keyframes pop{50%{transform:scale(1.07)}}
.msg{min-height:3.2em;text-align:center;margin:12px 0 6px;font-weight:700}
.msg.w{color:var(--win)}.msg.l{color:var(--mute)}.msg.e{color:var(--lose)}
.betrow{display:flex;gap:6px;margin-bottom:10px}
.betrow input{flex:1;min-width:0}
.spinbtn{width:100%;background:var(--btn);color:var(--btnink);border:0;font-size:1.25rem;padding:14px;border-radius:14px}
.spinbtn:disabled{opacity:.5;cursor:default}
.lbl{font-size:.85rem;color:var(--mute);margin:0 0 6px}
.hint{display:none;text-align:center;color:var(--mute);font-size:.85rem;margin:10px 0 0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.add{display:flex;gap:6px;flex-wrap:wrap}
.add input{flex:1 1 90px;width:auto}
.add .go{background:var(--btn);color:var(--btnink);border:0}
table{width:100%;border-collapse:collapse;font-size:.95rem}
td{padding:5px 0;border-bottom:1px solid var(--line)}
td:last-child{text-align:right;font-weight:700;color:var(--brass)}
tr:last-child td{border:0}
.pi svg{width:24px;height:24px;vertical-align:middle;margin-right:2px}
.foot{display:flex;justify-content:space-between;color:var(--mute);font-size:.85rem;gap:8px;flex-wrap:wrap}
.foot button{min-height:36px;padding:6px 10px;font-weight:500}
dialog{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:16px;padding:18px;width:min(92vw,460px);max-height:90vh;overflow:auto}
dialog::backdrop{background:rgba(0,0,0,.65)}
.row{margin:14px 0}
.ver{color:var(--mute);font-size:.85rem;display:flex;justify-content:space-between;align-items:center;margin-top:16px}
input[type=range]{padding:0;accent-color:var(--brass)}
.jp{position:fixed;inset:0;z-index:50;display:grid;place-items:center;text-align:center;background:rgba(0,0,0,.72);cursor:pointer}
.jp[hidden]{display:none}
.jp.mega{animation:flash .6s 6}
@keyframes flash{50%{background:rgba(120,60,0,.85)}}
#cv{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.jpt{position:relative;display:grid;gap:8px;color:#fff;font-size:1.6rem;font-weight:800;padding:0 16px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.jpt b{font-size:clamp(2.2rem,12vw,4.2rem);background:linear-gradient(90deg,#ff5f6d,#ffc371,#6fe3b0,#5fa8ff,#c77dff,#ff5f6d);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:rb 1.2s linear infinite,zoom .7s}
@keyframes rb{to{background-position:-200% 0}}
@keyframes zoom{0%{transform:scale(.2);opacity:0}70%{transform:scale(1.15)}}
.reel.thud{animation:thud .22s}
@keyframes thud{40%{transform:translateY(4px) scaleY(.985)}}
.toast{position:fixed;inset:auto 0 calc(24px + env(safe-area-inset-bottom,0px)) 0;margin:0 auto;width:max-content;max-width:min(92vw,440px);transform:translateY(16px) scale(.96);padding:12px 18px;border:1px solid var(--brass);border-radius:16px;background:var(--panel);color:var(--ink);font-weight:700;text-align:center;line-height:1.3;overflow-wrap:anywhere;box-shadow:0 8px 30px rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .25s,transform .3s cubic-bezier(.2,.9,.3,1.2);overflow:visible;z-index:100}
.toast.on{opacity:1;transform:none}
@media (min-width:900px){
#app{max-width:1080px;padding:28px 32px 40px;gap:18px;grid-template-columns:minmax(0,1fr) 380px;grid-template-rows:auto auto auto auto auto auto 1fr auto;grid-template-areas:"top top" "machine bal" "machine gift" "machine wd" "machine add" "machine rst" "machine pay" "foot foot";align-items:start}
.top{display:flex;justify-content:space-between;align-items:center;gap:20px}
.ctl{margin-top:0}
h1{font-size:2rem}
.machine{padding:26px;align-self:start;position:sticky;top:20px}
.reels{gap:16px}
.reel{aspect-ratio:1/1.15}
.msg{font-size:1.2rem;margin:18px 0 10px}
.spinbtn{font-size:1.4rem;padding:18px}
.payc{align-self:stretch}
}
@media (hover:hover) and (min-width:900px){.hint{display:block}}
@media (prefers-reduced-motion:reduce){.reel.thud,.reel.hit,.machine.shake,.machine.glow,.jp.mega,.jpt b{animation:none}}

[hidden]{display:none!important}
dialog[open]{animation:dpop .3s cubic-bezier(.2,.9,.3,1.2)}dialog[open]::backdrop{animation:dfade .3s}
@keyframes dpop{from{opacity:0;transform:translateY(16px) scale(.93)}}@keyframes dfade{from{opacity:0}}
@keyframes shk{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.shk{animation:shk .4s}
.tabs{position:relative;display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:12px;padding:3px;margin:12px 0}
.tabs button{border:0;position:relative;z-index:1;transition:color .25s}.tabs button.on{color:var(--btnink)}
.tabs i{position:absolute;top:3px;bottom:3px;left:3px;width:calc(50% - 3px);background:var(--btn);border-radius:9px;transform:translateX(calc(var(--i,0)*100%));transition:transform .3s cubic-bezier(.3,1.3,.5,1)}
.amsg{color:var(--lose);min-height:1.4em;margin:6px 0;text-align:center;font-weight:700}
.big{font-size:1.3rem;font-weight:800;margin:12px 0 4px;text-align:center;overflow-wrap:anywhere}
#asub.ld{opacity:.6;pointer-events:none}#asub.ld::after{content:"";display:inline-block;width:1em;height:1em;margin-left:8px;vertical-align:-2px;border:2px solid currentColor;border-top-color:transparent;border-radius:50%;animation:spn .6s linear infinite}
@keyframes spn{to{transform:rotate(360deg)}}
#asub.ok{background:var(--win);color:#fff;animation:pop .5s}
#accbtn{max-width:9em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block!important}
.pulse{animation:pls .6s 3}@keyframes pls{50%{box-shadow:0 0 0 6px var(--brass);border-color:var(--brass)}}
.addc{position:relative}.addc.lock .add{opacity:.45}
.addc.lock::after{content:attr(data-lock);position:absolute;inset:0;display:grid;place-items:center;font-weight:800;cursor:pointer;background:color-mix(in srgb,var(--panel) 55%,transparent);border-radius:14px}
.em{font-size:clamp(1.8rem,9vw,3.4rem);line-height:1}.pi .em{font-size:20px}
.drow{display:flex;align-items:center;gap:8px;margin:4px 0}.drow input,.drow select{min-width:0;flex:1}.drow small{width:3.6em;color:var(--mute)}
@media (prefers-reduced-motion:reduce){dialog[open],dialog[open]::backdrop,.shk,.pulse,#asub.ok{animation:none}.tabs i{transition:none}}
#devbtn,#close,#aclose,#dclose{border:2px solid #e5484d}
.giftc.okf{animation:pop .5s}.giftc input{text-transform:uppercase}
.gbox{max-height:230px;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:2px 8px}
.gbox .drow small:first-child,.gc{flex:1;width:auto;color:var(--ink);font-variant-numeric:tabular-nums;font-size:.8rem}
#accbtn{display:flex!important;align-items:center;gap:6px}
#accbtn.dev,#acc.dev{border:2px solid #e5484d}
.xo{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border-color:transparent;margin-bottom:2px}.xo.on{border-color:var(--brass)}
.cs{position:relative;flex:1;min-width:0}.csb{width:100%;display:flex;justify-content:space-between;align-items:center;gap:6px;background:var(--reel);padding:6px 10px}
.csm{position:absolute;left:0;top:100%;margin-top:4px;z-index:40;min-width:max(100%,130px);max-height:230px;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:4px;box-shadow:0 8px 30px rgba(0,0,0,.4);animation:dpop .2s}
.av{display:inline-grid;place-items:center;border-radius:50%;object-fit:cover;background:var(--btn);color:var(--btnink);font-weight:800;flex-shrink:0}
.av.xs{width:22px;height:22px;font-size:.75rem}.av.sm{width:28px;height:28px;font-size:.9rem}.av.lg{width:64px;height:64px;font-size:1.6rem}
.prof{display:flex;align-items:center;gap:12px;margin-top:12px}.cls{font-size:.8rem;color:var(--mute)}.cls.d{color:var(--lose);font-weight:700}
.reels{position:relative}.reels.lock .reel{filter:blur(7px) grayscale(.4)}
.dbt{position:absolute;inset:0;display:none;place-items:center;pointer-events:none}.reels.lock .dbt{display:grid;animation:dfade .4s}
.dbt svg{position:absolute;inset:0;width:100%;height:100%}.dbt path{stroke:#e5484d;stroke-width:8;stroke-linecap:round;fill:none;vector-effect:non-scaling-stroke}
.dbt b{position:relative;color:#fff;background:rgba(179,38,62,.92);padding:6px 14px;border-radius:12px;font-size:clamp(1.1rem,5vw,2.2rem);font-weight:800;text-align:center;line-height:1.15;animation:dbp 1.1s ease-in-out infinite}
.dnote{color:var(--lose);margin:4px 4px 0;font-weight:700;font-size:.9rem;text-align:center}
.bal b.neg{color:var(--lose);transform-origin:right center;animation:dbp 1.1s ease-in-out infinite}
@keyframes dbp{50%{transform:scale(1.12);opacity:.7}}
select{font:inherit;color:inherit;background:var(--reel);border:1px solid var(--line);border-radius:10px;padding:10px;min-height:44px;width:100%;font-weight:700}
:root[data-theme="light"] .machine{border:1px solid var(--line);box-shadow:0 24px 50px -24px rgba(0,0,0,.2)}
:root[data-theme="light"] .card,:root[data-theme="light"] .bal{border-color:transparent;box-shadow:0 1px 3px rgba(0,0,0,.07)}
:root[data-theme="light"] .reel{border-color:transparent;box-shadow:inset 0 0 0 1px var(--line)}
:root[data-theme="light"] .spinbtn{background:linear-gradient(180deg,#2c2c30,#0b0b0c);box-shadow:0 10px 22px -10px rgba(0,0,0,.55)}
:root[data-theme="light"] .bal b{color:var(--ink)}
@media (prefers-reduced-motion:reduce){.dbt b,.bal b.neg{animation:none}}

/* ===== 3.4: интерфейс под любые языки ===== */
h1{overflow-wrap:anywhere;background:linear-gradient(90deg,var(--brass),#ff9d5c,#6fe3b0,var(--brass));background-size:240% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:rb 8s linear infinite}
.top>div:first-child{min-width:0}.ctl{flex-wrap:wrap}
button{overflow-wrap:anywhere;line-height:1.2}
.betrow{flex-wrap:wrap}.betrow input{flex:1 1 80px}.betrow button{flex:0 0 auto}
.bal{flex-wrap:wrap}.ver{flex-wrap:wrap;gap:8px}.lbl,.msg,td,.sub{overflow-wrap:anywhere}
.tabs button{padding:10px 6px;font-size:.95rem}.xo span{min-width:0}.drow{flex-wrap:wrap}
.csb>span:first-child{min-width:0;display:flex;align-items:center;gap:8px;overflow:hidden;white-space:nowrap}
.add input{min-width:0}dialog{overflow-x:hidden}
.bl{width:22px;height:22px;flex-shrink:0;border-radius:6px}
/* ===== 3.4: анимации ===== */
.menu:not([hidden]){animation:mpop .24s cubic-bezier(.2,.9,.3,1.2);transform-origin:top left}
@keyframes mpop{from{opacity:0;transform:translateY(-8px) scale(.94)}}
.menu:not([hidden]) .opt,.csm .xo{animation:oin .28s both}
.menu .opt:nth-child(2),.csm .xo:nth-child(2){animation-delay:.03s}.menu .opt:nth-child(3),.csm .xo:nth-child(3){animation-delay:.06s}.menu .opt:nth-child(4),.csm .xo:nth-child(4){animation-delay:.09s}.menu .opt:nth-child(5),.csm .xo:nth-child(5){animation-delay:.12s}.menu .opt:nth-child(n+6),.csm .xo:nth-child(n+6){animation-delay:.15s}
@keyframes oin{from{opacity:0;transform:translateX(-8px)}}
.msg.an{animation:msgin .4s cubic-bezier(.2,.9,.3,1.2)}.msg.w.an{animation:msgwin .65s cubic-bezier(.2,.9,.3,1.2)}
@keyframes msgin{from{opacity:0;transform:translateY(10px)}}
@keyframes msgwin{0%{opacity:0;transform:scale(.8)}45%{transform:scale(1.12);text-shadow:0 0 18px currentColor}100%{transform:none}}
.fly{position:fixed;left:0;top:0;z-index:70;pointer-events:none;font-weight:800;font-size:1.4rem;color:var(--win);white-space:nowrap;text-shadow:0 2px 14px rgba(0,0,0,.55);will-change:transform}
.bal b.bump{animation:bump .55s}
@keyframes bump{40%{transform:scale(1.2);filter:brightness(1.5)}}
.tt,.tt *{transition:background-color .5s,color .5s,border-color .5s,fill .5s,box-shadow .5s!important}
::view-transition-old(root),::view-transition-new(root){animation:none;mix-blend-mode:normal}
::view-transition-old(root){z-index:1}::view-transition-new(root){z-index:2}
/* ===== 3.4: вывод, телеграм, список изменений ===== */
.wdsum{display:grid;gap:2px;margin:8px 2px;font-size:.9rem;color:var(--mute)}.wdsum b{color:var(--win);font-size:1.05rem}
.wdc .spinbtn{margin-top:4px}.wdc .hint2,.hint2{color:var(--mute);font-size:.8rem;margin:8px 2px 0}
.codebox{width:100%;background:var(--reel);border:1px solid var(--line);border-radius:10px;padding:10px;color:var(--ink);font:12px/1.4 ui-monospace,Consolas,monospace;word-break:break-all;resize:vertical}
.wvr{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px solid var(--line);font-size:.9rem}.wvr b{text-align:right;overflow-wrap:anywhere}.bad{color:var(--lose)}.good{color:var(--win)}
.tgb{flex:1 1 100%;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;gap:10px;border:0;color:#fff;font-size:.95rem;padding:12px 14px;border-radius:14px;background:linear-gradient(90deg,#229ed9,#2aabee,#229ed9);background-size:200% 100%;animation:rb 5s linear infinite;box-shadow:0 8px 22px -10px rgba(34,158,217,.8)}
.tgb svg{width:22px;height:22px;flex-shrink:0}.tgb span{min-width:0}
.tgb::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.45) 50%,transparent 60%);transform:translateX(-120%);animation:shn 3.2s infinite}
@keyframes shn{to{transform:translateX(120%)}}
.tgb.done{animation:none;filter:grayscale(.45);opacity:.85}.tgb.done::after{display:none}
.clv{border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin:8px 0;animation:clin .45s both;animation-delay:var(--d,0ms)}
@keyframes clin{from{opacity:0;transform:translateY(12px)}}
.clh{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.clh b{font-size:1.05rem}.cln{background:var(--btn);color:var(--btnink);border-radius:999px;padding:1px 9px;font-size:.75rem;font-weight:800}
.clv ul{margin:6px 0 0;padding-left:1.1em}.clv li{margin:3px 0;overflow-wrap:anywhere}
#clx{border:2px solid #e5484d}
@media (prefers-reduced-motion:reduce){h1,.tgb,.tgb::after,.clv,.menu:not([hidden]),.csm,.menu .opt,.csm .xo,.msg.an,.bal b.bump{animation:none}.toast{transition:opacity .2s}}
.dng{border-color:var(--lose)!important;color:var(--lose)!important}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<radialGradient id="gC" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#ff7a7a"/><stop offset=".5" stop-color="#d4121f"/><stop offset="1" stop-color="#8a0a14"/></radialGradient>
